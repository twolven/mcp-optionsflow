name: CI
on: [pull_request, workflow_dispatch]
jobs:
  test:
    strategy:
      matrix: {os: [ubuntu-latest, windows-latest], python: ['3.12', '3.13', '3.14']}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '${{ matrix.python }}'}
      - run: uv sync --locked
      - run: uv lock --check
      - run: uv run ruff check .
      - run: uv run mypy .
      - run: uv run pytest
      - run: uv build
      - run: uv run python scripts/verify_wheel.py
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with: {python-version: '3.13'}
      - run: uv sync --locked
      - run: docker build --tag mcp-optionsflow:test .
      - run: docker run --detach --name mcp-optionsflow-test --publish 127.0.0.1:8000:8000 mcp-optionsflow:test
      - run: uv run python scripts/verify_http.py http://127.0.0.1:8000/mcp
      - if: always()
        run: docker logs mcp-optionsflow-test || true
      - if: always()
        run: docker rm --force mcp-optionsflow-test || true
